name: melist
description: "MELIST - Telegram Mini App"
publish_to: 'none'

version: 1.0.0

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.0.1
  talker: ^5.1.20
  talker_dio_logger: ^5.1.20
  talker_flutter: ^5.1.16
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  provider: ^6.1.5+1
  flutter_telegram_miniapp: ^0.1.2
  cached_network_image: ^4.0.4
  melist_core:

  material_ui: ^1.4.0
  flutter_web_plugins:
    sdk: flutter
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  meta: ^1.9.0
  flutter_lints: ^6.0.0
  icon_font_generator: ^4.1.0

flutter:
  uses-material-design: true
  fonts:
    - family: MelistIcons
      fonts:
        - asset: assets/fonts/melist_icons.otf