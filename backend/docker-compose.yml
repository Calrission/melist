services:
  db:
    image: postgres:16
    container_name: melist-pg
    environment:
      POSTGRES_USER: melist
      POSTGRES_PASSWORD: melist
      POSTGRES_DB: melist
    ports:
      - "5433:5432"
    volumes:
      - melist-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melist -d melist"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: melist-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      # Hostname `db` is the compose network; do not use localhost from .env.
      DATABASE_URL: postgres://melist:melist@db:5432/melist?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  melist-pg-data:
