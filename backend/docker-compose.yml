# Production stack for melist.online.
# From backend/, with backend/.env and frontend/.env in place:
#   docker compose up -d --build
# Postgres data stays in the volume melist-pg-data. Caddy keeps the
# Let's Encrypt certificate in caddy_data.
services:
  db:
    image: postgres:16
    container_name: melist-pg
    environment:
      POSTGRES_USER: melist
      POSTGRES_PASSWORD: melist
      POSTGRES_DB: melist
    volumes:
      - melist-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melist -d melist"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile.deploy
    container_name: melist-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://melist:melist@db:5432/melist?sslmode=disable
      # Release build baked into the image. Wins over an empty WEB_ROOT in .env.
      WEB_ROOT: /frontend/.build/web
      COOKIE_SECURE: "true"
      DEBUG_AUTH: "false"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    container_name: melist-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  melist-pg-data:
  caddy_data:
  caddy_config:
